<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>L'Alchimiste — Bistrot parisien</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,700&family=DM+Sans:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;1,400&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,700&family=Bodoni+Moda:ital,wght@0,400;0,700;1,400;1,700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>

  :root{
    --bg:#1a1410;
    --bg-2:#0f0c09;
    --bg-3:#241b14;
    --amber:#d4832a;
    --amber-bright:#e89a3c;
    --gold:#e8c87a;
    --ivory:#f2ede6;
    --muted:#9a8a78;
    --line:rgba(212,131,42,0.22);
    --line-soft:rgba(242,237,230,0.08);
    --serif:"Playfair Display", serif;
    --serif-2:"Cormorant Garamond", serif;
    --serif-3:"Libre Baskerville", serif;
    --sans:"DM Sans", system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ivory); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
  body{ overflow-x:hidden; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  img{ display:block; max-width:100%; }

  /* Film grain — overlay on the entire page */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index:200;
    opacity:0.08;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.85  0 0 0 0 0.7  0 0 0 0.5 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* Warm vignette behind hero */
  .hero-glow{
    position:absolute; pointer-events:none; z-index:0;
    width:900px; height:900px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(212,131,42,0.18), rgba(212,131,42,0.05) 40%, transparent 70%);
    filter:blur(20px);
    top:-200px; right:-200px;
  }

  /* === NAV === */
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 48px;
    background:linear-gradient(to bottom, rgba(15,12,9,0.85), rgba(15,12,9,0));
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:padding .35s ease, background .35s ease;
  }
  .nav.scrolled{
    padding:14px 48px;
    background:rgba(15,12,9,0.92);
    border-bottom:1px solid var(--line-soft);
  }
  .nav-logo{ display:flex; align-items:baseline; gap:8px; }
  .nav-logo .mark{
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:26px; color:var(--ivory);
    letter-spacing:0.5px;
  }
  .nav-logo .mark .amp{ color:var(--amber); }
  .nav-logo .tag{
    font-family:var(--serif-3); font-style:italic;
    font-size:11px; color:var(--muted);
    letter-spacing:1.5px; text-transform:uppercase;
  }
  .nav-links{ display:flex; gap:36px; align-items:center; }
  .nav-links a{
    font-size:13px; letter-spacing:0.5px; color:var(--ivory);
    opacity:0.78; transition:opacity .2s, color .2s;
    position:relative; padding:6px 0;
  }
  .nav-links a:hover{ opacity:1; color:var(--gold); }
  .nav-links a.active{ opacity:1; color:var(--gold); }
  .nav-links a.active::after{
    content:""; position:absolute; left:0; right:0; bottom:-2px;
    height:1px; background:var(--amber);
  }
  .nav-cta{
    background:transparent; border:1px solid var(--amber);
    color:var(--amber); padding:10px 18px; border-radius:999px;
    font-size:12px; letter-spacing:1.2px; text-transform:uppercase;
    transition:all .25s ease;
  }
  .nav-cta:hover{
    background:var(--amber); color:var(--bg);
    box-shadow:0 0 24px rgba(212,131,42,0.4);
  }
  .nav-burger{ display:none; }

  /* === HERO === */
  .hero{
    position:relative; min-height:100vh; padding:140px 48px 80px;
    display:grid; grid-template-columns:1.05fr 0.95fr;
    gap:40px; align-items:center; overflow:hidden;
    background:radial-gradient(ellipse at 20% 30%, rgba(212,131,42,0.08), transparent 50%),
               radial-gradient(ellipse at 80% 70%, rgba(232,200,122,0.04), transparent 55%),
               var(--bg);
  }
  .hero::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:120px;
    background:linear-gradient(to bottom, transparent, var(--bg));
    pointer-events:none; z-index:1;
  }
  .hero-content{ position:relative; z-index:2; max-width:640px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--serif-3); font-style:italic;
    font-size:13px; color:var(--gold); letter-spacing:2px;
    margin-bottom:32px;
  }
  .eyebrow .dash{ width:24px; height:1px; background:var(--gold); display:inline-block; }
  .hero h1{
    margin:0 0 24px;
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:clamp(56px, 7.4vw, 112px); line-height:0.95;
    color:var(--ivory); letter-spacing:-1px;
  }
  .hero h1 .sub{
    display:block; margin-top:14px;
    font-family:var(--sans); font-style:normal; font-weight:600;
    font-size:clamp(18px, 1.7vw, 26px); line-height:1.25;
    letter-spacing:1px; color:var(--gold);
    text-transform:uppercase;
  }
  .hero-tag{
    font-family:var(--serif-2); font-weight:500; font-style:italic;
    color:var(--muted);
    font-size:clamp(17px, 1.4vw, 21px); line-height:1.5;
    max-width:480px; margin:0 0 40px;
  }
  .hero-tag em{ color:var(--ivory); font-style:italic; }

  .word{ display:inline-block; opacity:0; transform:translateY(28px); }
  .word.in{ animation:wordIn .9s cubic-bezier(0.2,0.7,0.2,1) forwards; }
  @keyframes wordIn{ to{ opacity:1; transform:translateY(0);} }

  .hero-ctas{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .btn{
    border:none; outline:none; cursor:pointer;
    font-family:var(--sans); font-weight:500;
    font-size:14px; letter-spacing:1.4px; text-transform:uppercase;
    padding:18px 32px; border-radius:999px;
    transition:all .3s cubic-bezier(0.2,0.7,0.2,1);
    display:inline-flex; align-items:center; gap:12px;
  }
  .btn-primary{
    background:var(--amber); color:#1a1410;
    box-shadow:0 8px 24px rgba(212,131,42,0.25);
  }
  .btn-primary:hover{
    background:var(--amber-bright);
    box-shadow:0 0 32px rgba(212,131,42,0.55), 0 8px 28px rgba(212,131,42,0.35);
    transform:translateY(-2px);
  }
  .btn-ghost{
    background:transparent; color:var(--ivory);
    border:1px solid rgba(242,237,230,0.25);
  }
  .btn-ghost:hover{ border-color:var(--ivory); background:rgba(242,237,230,0.05); }
  .btn .arrow{ font-size:18px; transition:transform .25s ease; }
  .btn:hover .arrow{ transform:translateX(3px); }

  .hero-meta{
    margin-top:48px; display:flex; gap:32px; align-items:center;
    color:var(--muted); font-size:12px; letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .hero-meta .stars{ color:var(--gold); letter-spacing:2px; font-size:14px; }
  .hero-meta .divider{ width:1px; height:14px; background:var(--line-soft); }

  /* Hero plate */
  .hero-visual{
    position:relative; z-index:2;
    display:flex; justify-content:center; align-items:center;
    height:600px;
  }
  .plate-wrap{
    position:relative;
    width:min(540px, 90%); aspect-ratio:1;
    transform:rotate(-4deg);
    animation:floatY 5.5s ease-in-out infinite;
  }
  @keyframes floatY{
    0%,100%{ transform:rotate(-4deg) translateY(-8px); }
    50%   { transform:rotate(-4deg) translateY(8px); }
  }
  .plate{
    position:relative; width:100%; height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(232,200,122,0.18), transparent 40%),
      radial-gradient(circle at 50% 50%, #2a2018 0%, #1e1610 60%, #120c08 100%);
    border:1px solid rgba(232,200,122,0.18);
    box-shadow:
      0 40px 80px -20px rgba(0,0,0,0.6),
      inset 0 0 40px rgba(0,0,0,0.5),
      0 0 80px rgba(212,131,42,0.12);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  /* Placeholder food illustration on the plate (stripes + label) */
  .plate-inner{
    position:absolute; inset:14%;
    border-radius:50%;
    background:
      repeating-linear-gradient(
        135deg,
        rgba(212,131,42,0.08) 0,
        rgba(212,131,42,0.08) 6px,
        transparent 6px,
        transparent 14px
      ),
      radial-gradient(circle, rgba(212,131,42,0.18), rgba(15,12,9,0.6) 70%);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    color:var(--muted);
    font-family:"Courier New", monospace; font-size:11px;
    letter-spacing:2px; text-align:center;
    text-transform:uppercase;
  }
  .plate-inner span{ display:block; max-width:60%; line-height:1.6; }

  /* Dashed orbit ring */
  .plate-ring{
    position:absolute; inset:-32px;
    border-radius:50%;
    border:1px dashed rgba(232,200,122,0.28);
    animation:spin 60s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Open-tonight badge */
  .open-badge{
    position:absolute; top:24px; right:-20px;
    background:var(--bg-3);
    border:1px solid var(--line);
    padding:14px 18px; border-radius:14px;
    display:flex; align-items:center; gap:12px;
    box-shadow:0 12px 32px rgba(0,0,0,0.6), 0 0 24px rgba(212,131,42,0.15);
    z-index:3;
    transform:rotate(2deg);
  }
  .open-badge .flame{
    width:36px; height:36px; border-radius:50%;
    background:radial-gradient(circle at 50% 60%, var(--amber-bright), var(--amber) 60%, #8a4e15);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 16px rgba(212,131,42,0.5);
    flex-shrink:0;
  }
  .open-badge .flame svg{ width:18px; height:18px; }
  .open-badge .lbl{
    font-family:var(--serif-3); font-style:italic; font-size:10px;
    color:var(--muted); letter-spacing:1.5px; text-transform:uppercase;
    margin-bottom:2px;
  }
  .open-badge .val{
    font-family:var(--sans); font-weight:600; font-size:13px;
    color:var(--ivory); letter-spacing:0.5px;
  }
  .open-badge .pulse{
    width:6px; height:6px; border-radius:50%;
    background:#5fd28a; display:inline-block; margin-right:6px;
    box-shadow:0 0 0 0 rgba(95,210,138,0.6);
    animation:pulse 1.8s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(95,210,138,0.5); }
    70%{ box-shadow:0 0 0 8px rgba(95,210,138,0); }
    100%{ box-shadow:0 0 0 0 rgba(95,210,138,0); }
  }

  /* Floating dish card */
  .dish-card{
    position:absolute; left:-32px; bottom:24px;
    background:rgba(36,27,20,0.92);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    display:flex; gap:14px; align-items:center;
    box-shadow:0 24px 60px rgba(0,0,0,0.55);
    backdrop-filter:blur(8px);
    z-index:3;
    width:280px;
    transform:rotate(-2deg);
  }
  .dish-thumb{
    width:56px; height:56px; border-radius:12px;
    background:
      repeating-linear-gradient(45deg,
        rgba(212,131,42,0.18) 0, rgba(212,131,42,0.18) 4px,
        rgba(15,12,9,0.6) 4px, rgba(15,12,9,0.6) 8px);
    border:1px solid rgba(232,200,122,0.2);
    flex-shrink:0;
  }
  .dish-info .name{
    font-family:var(--serif-3); font-style:italic;
    font-size:14px; color:var(--ivory); margin-bottom:3px;
  }
  .dish-info .desc{
    font-size:11px; color:var(--muted); line-height:1.4;
  }
  .dish-info .price{
    font-family:var(--serif-2); font-weight:700; font-size:16px;
    color:var(--amber); margin-top:4px;
  }

  /* Scroll cue */
  .scroll-cue{
    position:absolute; bottom:24px; left:50%;
    transform:translateX(-50%);
    z-index:3;
    display:flex; flex-direction:column; align-items:center;
    gap:10px; color:var(--muted);
    font-family:var(--serif-3); font-style:italic; font-size:11px;
    letter-spacing:2px; text-transform:uppercase;
  }
  .scroll-cue .line{
    width:1px; height:40px; background:linear-gradient(to bottom, var(--amber), transparent);
    animation:scrollLine 2s ease-in-out infinite;
  }
  @keyframes scrollLine{
    0%,100%{ transform:scaleY(1); opacity:0.4; }
    50%{ transform:scaleY(0.6); opacity:1; }
  }

  /* === STATS BAND === */
  .stats{
    position:relative;
    border-top:1px solid var(--line-soft);
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(to bottom, var(--bg-2), var(--bg));
    padding:48px 48px;
    display:grid; grid-template-columns:repeat(4, 1fr);
    gap:32px; align-items:center;
  }
  .stat{ text-align:center; position:relative; }
  .stat:not(:last-child)::after{
    content:""; position:absolute; right:-16px; top:50%; transform:translateY(-50%);
    width:1px; height:50px; background:var(--line-soft);
  }
  .stat .num{
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:48px; line-height:1; color:var(--amber);
    letter-spacing:-1px;
  }
  .stat .lbl{
    margin-top:8px;
    font-family:var(--serif-3); font-style:italic;
    font-size:13px; color:var(--ivory);
    letter-spacing:0.5px;
  }
  .stat .sub{
    font-size:11px; color:var(--muted);
    letter-spacing:1.5px; text-transform:uppercase;
    margin-top:4px;
  }

  /* === SECTION HEADING === */
  .section{ padding:120px 48px; position:relative; }
  .section-eyebrow{
    display:flex; align-items:center; gap:14px;
    font-family:var(--serif-3); font-style:italic;
    font-size:12px; color:var(--amber); letter-spacing:3px;
    text-transform:uppercase; margin-bottom:24px;
  }
  .section-eyebrow .dash{ width:32px; height:1px; background:var(--amber); }
  .section-title{
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:clamp(40px, 4.5vw, 64px); line-height:1.05;
    color:var(--ivory); letter-spacing:-1px; margin:0 0 24px;
  }
  .section-title em{
    color:var(--amber); font-style:italic;
    background:linear-gradient(120deg, var(--amber), var(--gold));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .section-lede{
    font-family:var(--serif-2); font-weight:500; font-style:italic;
    color:var(--muted); font-size:18px; line-height:1.6;
    max-width:560px;
  }

  /* === SPECIALTIES === */
  .specialties{ background:var(--bg); }
  .specialties-head{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:48px; margin-bottom:64px; flex-wrap:wrap;
  }
  .ardoise{
    font-family:var(--serif-3); font-style:italic;
    color:var(--muted); font-size:13px;
    letter-spacing:1px;
    border-left:2px solid var(--amber);
    padding-left:14px;
  }
  .ardoise b{
    display:block; font-style:normal; font-weight:600;
    color:var(--ivory); font-family:var(--sans);
    font-size:12px; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:4px;
  }
  .specialty-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:24px;
  }
  .spec-card{
    position:relative;
    background:rgba(36,27,20,0.5);
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px;
    transition:transform .35s cubic-bezier(0.2,0.7,0.2,1), box-shadow .35s, border-color .35s;
    overflow:hidden;
    cursor:pointer;
  }
  .spec-card::before{
    content:""; position:absolute; inset:0; border-radius:18px;
    background:radial-gradient(circle at 50% 0%, rgba(212,131,42,0.15), transparent 60%);
    opacity:0; transition:opacity .35s;
    pointer-events:none;
  }
  .spec-card:hover{
    transform:translateY(-6px);
    border-color:rgba(212,131,42,0.5);
    box-shadow:0 24px 60px -10px rgba(0,0,0,0.6), 0 0 40px rgba(212,131,42,0.18);
  }
  .spec-card:hover::before{ opacity:1; }
  .spec-card .num{
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:14px; color:var(--amber); letter-spacing:2px;
  }
  .spec-card .picto{
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(135deg, rgba(212,131,42,0.15), rgba(232,200,122,0.05));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    margin:18px 0 22px;
    transition:transform .4s ease;
  }
  .spec-card:hover .picto{ transform:rotate(-8deg) scale(1.06); }
  .spec-card .picto svg{ width:28px; height:28px; stroke:var(--gold); fill:none; stroke-width:1.4; }
  .spec-card h3{
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:28px; line-height:1.1; color:var(--ivory);
    margin:0 0 12px;
  }
  .spec-card .ingredients{
    font-family:var(--serif-3); font-style:italic;
    color:var(--muted); font-size:13px; line-height:1.6;
    margin:0 0 24px;
  }
  .spec-card .price-row{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:18px; border-top:1px dashed var(--line);
  }
  .spec-card .price{
    font-family:var(--serif-2); font-weight:700;
    font-size:24px; color:var(--amber);
  }
  .spec-card .arrow-btn{
    width:36px; height:36px; border-radius:50%;
    background:transparent; border:1px solid var(--line);
    color:var(--amber);
    display:flex; align-items:center; justify-content:center;
    transition:all .25s ease;
  }
  .spec-card:hover .arrow-btn{
    background:var(--amber); color:var(--bg); border-color:var(--amber);
  }
  .spec-card .tag{
    position:absolute; top:24px; right:24px;
    font-family:var(--serif-3); font-style:italic;
    font-size:10px; color:var(--gold); letter-spacing:1.5px;
    text-transform:uppercase;
    padding:4px 10px; border-radius:999px;
    background:rgba(232,200,122,0.08);
    border:1px solid rgba(232,200,122,0.2);
  }

  /* === AMBIANCE === */
  .ambiance{
    background:
      radial-gradient(ellipse at 20% 30%, rgba(212,131,42,0.18), transparent 50%),
      linear-gradient(135deg, #2a1a10 0%, #3a2418 50%, #2a1a10 100%);
    padding:120px 48px;
    position:relative;
    overflow:hidden;
  }
  .ambiance::before{
    content:""; position:absolute; inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='1'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/></svg>");
    mix-blend-mode:overlay; opacity:0.35;
    pointer-events:none;
  }
  .ambiance-grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:80px; align-items:center;
    position:relative; z-index:1;
  }
  .ambiance-text h2{
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:clamp(40px, 4.4vw, 60px); line-height:1.05;
    color:var(--ivory); letter-spacing:-1px; margin:0 0 28px;
  }
  .ambiance-text h2 span{ display:block; color:var(--gold); }
  .ambiance-text p{
    font-family:var(--serif-2); font-style:italic; font-weight:500;
    font-size:18px; line-height:1.65; color:var(--ivory);
    opacity:0.85; margin:0 0 18px;
    max-width:480px;
  }
  .ambiance-text .signature{
    margin-top:36px;
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:32px; color:var(--gold);
  }
  .ambiance-text .signature-sub{
    font-family:var(--sans); font-size:11px; color:var(--muted);
    letter-spacing:2px; text-transform:uppercase; margin-top:4px;
  }
  .ambiance-tiles{
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
    aspect-ratio:1.05/1;
  }
  .tile{
    border-radius:14px;
    background:rgba(15,12,9,0.5);
    border:1px solid var(--line);
    padding:24px;
    display:flex; flex-direction:column; justify-content:space-between;
    position:relative; overflow:hidden;
    transition:transform .4s ease;
  }
  .tile:hover{ transform:translateY(-4px); }
  .tile-1{ background:
    repeating-linear-gradient(0deg, rgba(232,200,122,0.05) 0 1px, transparent 1px 32px),
    linear-gradient(135deg, #1a0f08, #2a1a10);
  }
  .tile-2{ background:
    radial-gradient(circle at 30% 30%, rgba(232,200,122,0.18), transparent 60%),
    linear-gradient(180deg, #1f1610, #0f0a06);
  }
  .tile-3{ background:
    repeating-linear-gradient(90deg, rgba(212,131,42,0.06) 0 1px, transparent 1px 20px),
    linear-gradient(225deg, #2a1a10, #14100a);
  }
  .tile-4{ background:
    radial-gradient(circle at 70% 70%, rgba(212,131,42,0.22), transparent 55%),
    linear-gradient(45deg, #0f0a06, #2a1a10);
  }
  .tile .ph{
    font-family:"Courier New", monospace; font-size:9px;
    color:rgba(242,237,230,0.35); letter-spacing:1.5px;
    text-transform:uppercase; line-height:1.5;
  }
  .tile .ic{ width:32px; height:32px; opacity:0.5; }
  .tile h4{
    font-family:var(--serif-3); font-style:italic;
    font-size:14px; color:var(--ivory); margin:0;
  }

  /* === MENU PREVIEW === */
  .menu-preview{
    background:var(--bg-2);
    padding:120px 48px;
  }
  .menu-head{ text-align:center; margin-bottom:64px; }
  .menu-head .section-eyebrow{ justify-content:center; }
  .menu-head .section-title{ max-width:none; }
  .menu-grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:64px; max-width:1100px; margin:0 auto;
  }
  .menu-col h3{
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:24px; color:var(--gold); margin:0 0 28px;
    padding-bottom:14px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .menu-col h3 .count{
    font-family:var(--sans); font-size:11px; color:var(--muted);
    letter-spacing:2px; font-style:normal;
  }
  .menu-item{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:16px; padding:16px 0;
    border-bottom:1px dashed var(--line-soft);
  }
  .menu-item:last-child{ border-bottom:none; }
  .menu-item .name{
    font-family:var(--serif-3); font-style:italic;
    font-size:16px; color:var(--ivory);
  }
  .menu-item .desc{
    font-size:12px; color:var(--muted); margin-top:4px;
    letter-spacing:0.3px;
  }
  .menu-item .dots{
    flex:1; border-bottom:1px dotted rgba(154,138,120,0.4);
    margin:0 8px; transform:translateY(-3px);
  }
  .menu-item .pr{
    font-family:var(--serif-2); font-weight:700;
    font-size:18px; color:var(--amber);
    white-space:nowrap;
  }
  .menu-item .meta{
    flex-direction:column; display:flex;
  }

  /* === RESERVATION === */
  .reservation{
    background:var(--bg);
    padding:120px 48px;
    position:relative; overflow:hidden;
  }
  .reservation::before{
    content:""; position:absolute;
    width:600px; height:600px; border-radius:50%;
    background:radial-gradient(circle, rgba(212,131,42,0.1), transparent 60%);
    top:-200px; left:-200px; filter:blur(40px);
  }
  .reservation-inner{
    max-width:680px; margin:0 auto; text-align:center;
    position:relative;
  }
  .reservation-inner .section-eyebrow{ justify-content:center; }
  .form-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:18px;
    margin-top:48px; text-align:left;
  }
  .form-field{ position:relative; }
  .form-field.full{ grid-column:1/-1; }
  .form-field label{
    display:block; font-family:var(--serif-3); font-style:italic;
    color:var(--muted); font-size:12px; letter-spacing:1.5px;
    margin-bottom:8px; text-transform:uppercase;
  }
  .form-field input, .form-field select{
    width:100%; padding:16px 18px;
    background:rgba(36,27,20,0.4);
    border:1px solid var(--line-soft);
    border-radius:10px;
    color:var(--ivory); font-family:var(--sans); font-size:15px;
    transition:all .25s ease;
    outline:none;
  }
  .form-field input:focus, .form-field select:focus{
    border-color:var(--amber);
    background:rgba(36,27,20,0.7);
    box-shadow:0 0 0 4px rgba(212,131,42,0.1);
  }
  .form-field input::placeholder{ color:rgba(154,138,120,0.5); }
  .form-field select{
    appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23d4832a' stroke-width='1.5' fill='none'/></svg>");
    background-repeat:no-repeat;
    background-position:right 18px center;
    padding-right:42px;
  }
  .form-field .err{
    position:absolute; bottom:-18px; left:2px;
    font-size:11px; color:#e88a4a;
    font-family:var(--sans);
  }
  .form-field.has-error input,
  .form-field.has-error select{
    border-color:rgba(232,138,74,0.5);
  }

  .slot-row{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .slot{
    padding:10px 14px; border-radius:8px;
    background:rgba(36,27,20,0.4);
    border:1px solid var(--line-soft);
    color:var(--ivory); font-size:13px; font-family:var(--sans);
    cursor:pointer; transition:all .2s ease;
  }
  .slot:hover{ border-color:var(--line); color:var(--gold); }
  .slot.active{
    background:var(--amber); color:var(--bg);
    border-color:var(--amber);
    box-shadow:0 0 16px rgba(212,131,42,0.3);
  }
  .slot.full{ opacity:0.35; cursor:not-allowed; text-decoration:line-through; }

  .submit-row{
    margin-top:36px;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  .phone-line{
    font-family:var(--serif-3); font-style:italic;
    color:var(--muted); font-size:13px;
  }
  .phone-line a{ color:var(--gold); }

  /* Success state */
  .reservation-success{
    padding:60px 0;
    animation:fadeUp .6s ease-out;
  }
  .reservation-success .check{
    width:80px; height:80px; border-radius:50%;
    margin:0 auto 24px;
    background:rgba(212,131,42,0.1);
    border:1px solid var(--amber);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 40px rgba(212,131,42,0.25);
  }
  .reservation-success h3{
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:36px; color:var(--ivory); margin:0 0 16px;
  }
  .reservation-success p{
    font-family:var(--serif-2); font-style:italic; font-weight:500;
    color:var(--muted); font-size:18px; line-height:1.6;
    max-width:480px; margin:0 auto;
  }
  .reservation-success .ref{
    display:inline-block; margin-top:24px;
    padding:8px 16px; border-radius:999px;
    background:rgba(36,27,20,0.6); border:1px solid var(--line);
    font-family:"Courier New", monospace; font-size:12px;
    color:var(--gold); letter-spacing:2px;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(20px);}
    to{ opacity:1; transform:none;}
  }

  /* === REVEAL on scroll === */
  .reveal{ opacity:0; transform:translateY(28px); transition:opacity .8s cubic-bezier(0.2,0.7,0.2,1), transform .8s cubic-bezier(0.2,0.7,0.2,1); }
  .reveal.in{ opacity:1; transform:none; }
  .reveal[data-delay="1"]{ transition-delay:.1s; }
  .reveal[data-delay="2"]{ transition-delay:.2s; }
  .reveal[data-delay="3"]{ transition-delay:.3s; }
  .reveal[data-delay="4"]{ transition-delay:.4s; }

  /* === FOOTER === */
  footer{
    background:#000;
    padding:80px 48px 32px;
    border-top:1px solid var(--line-soft);
  }
  .foot-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr 1fr;
    gap:48px;
    max-width:1280px; margin:0 auto;
  }
  .foot-brand .mark{
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:36px; color:var(--ivory); margin-bottom:14px;
  }
  .foot-brand .desc{
    font-family:var(--serif-3); font-style:italic;
    color:var(--muted); font-size:14px; line-height:1.6;
    max-width:280px;
  }
  .foot-col h5{
    font-family:var(--sans); font-weight:600;
    font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--gold); margin:0 0 18px;
  }
  .foot-col p, .foot-col a{
    font-size:13px; color:var(--muted);
    line-height:1.8; display:block;
  }
  .foot-col a:hover{ color:var(--ivory); }
  .foot-col .hours{
    font-family:var(--serif-3); font-style:italic;
    font-size:13px; line-height:1.7;
  }
  .foot-col .hours .day{ color:var(--ivory); }
  .foot-bottom{
    max-width:1280px; margin:64px auto 0;
    padding-top:32px; border-top:1px solid var(--line-soft);
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:16px;
  }
  .foot-bottom .closing{
    font-family:var(--serif); font-style:italic;
    color:var(--gold); font-size:16px;
  }
  .foot-bottom .credit{
    font-size:11px; color:var(--muted);
    letter-spacing:1.5px; text-transform:uppercase;
  }

  /* === Responsive === */
  @media (max-width: 1000px){
    .hero{ grid-template-columns:1fr; padding:120px 24px 60px; gap:40px;}
    .hero-visual{ height:auto; }
    .plate-wrap{ width:min(420px, 100%); }
    .open-badge{ right:0; }
    .dish-card{ left:0; }
    .stats{ grid-template-columns:repeat(2, 1fr); padding:32px 24px; gap:24px;}
    .stat:nth-child(2)::after{ display:none; }
    .specialty-grid{ grid-template-columns:1fr; }
    .ambiance-grid{ grid-template-columns:1fr; gap:48px; }
    .menu-grid{ grid-template-columns:1fr; gap:48px; }
    .section{ padding:80px 24px; }
    .ambiance, .menu-preview, .reservation{ padding:80px 24px; }
    .form-grid{ grid-template-columns:1fr; }
    .foot-grid{ grid-template-columns:1fr 1fr; gap:32px; }
    .nav{ padding:16px 24px; }
    .nav.scrolled{ padding:12px 24px; }
    .nav-links{ display:none; }
    .nav-burger{
      display:flex; flex-direction:column; gap:5px;
      background:transparent; border:none; padding:8px;
    }
    .nav-burger span{
      width:22px; height:1px; background:var(--ivory);
      transition:all .25s;
    }
    .nav-cta{ display:none; }
    footer{ padding:60px 24px 24px; }
  }
  @media (max-width: 560px){
    .hero h1{ font-size:54px; }
    .stats{ grid-template-columns:1fr 1fr; }
    .foot-grid{ grid-template-columns:1fr; }
  }


/* ============================================================
   THEMES (theme.css inlined)
   ============================================================ */
/* ============================================================
   theme.css — alternate themes for L'Alchimiste
   ============================================================
   Themes are switched via [data-theme] on <html>. The default
   ("soir") is defined in the main file. Each theme override
   block re-declares CSS variables AND adds theme-specific
   styling (ornaments, paper textures, card chrome, etc).
   ============================================================ */


/* ─── Shared: fonts that ride in alongside the base set ─────── */
/* Loaded via <link> in head — listed here for reference only.
   EB Garamond, Bodoni Moda, Crimson Pro, Courier Prime
*/


/* ============================================================
   B · CARNET DE PAULO — editorial / kraft paper
   ============================================================ */
html[data-theme="carnet"]{
  --bg:#e6d8bd;          /* kraft paper */
  --bg-2:#dcc99f;
  --bg-3:#efe3c8;
  --amber:#a8341c;       /* red minium ink */
  --amber-bright:#c43e22;
  --gold:#6b4a1f;        /* sepia */
  --ivory:#2a1a0e;       /* ink */
  --muted:#7a5a3a;
  --line:rgba(42,26,14,0.45);
  --line-soft:rgba(42,26,14,0.18);
  --serif:"EB Garamond", serif;
  --serif-2:"EB Garamond", serif;
  --serif-3:"Courier Prime", "Courier New", monospace;
  --sans:"Crimson Pro", "EB Garamond", serif;
}

/* Body grain — fibres de papier, not film */
html[data-theme="carnet"] body{
  background:var(--bg);
  color:var(--ivory);
}
html[data-theme="carnet"] body::before{
  opacity:0.5;
  mix-blend-mode:multiply;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2'/><feColorMatrix values='0 0 0 0 0.25  0 0 0 0 0.15  0 0 0 0 0.06  0 0 0 0.4 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
html[data-theme="carnet"] body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:199;
  background:
    repeating-linear-gradient(180deg, transparent 0 32px, rgba(42,26,14,0.04) 32px 33px),
    radial-gradient(ellipse at center, transparent 60%, rgba(42,26,14,0.12) 100%);
}

/* Nav as a masthead */
html[data-theme="carnet"] .nav{
  background:var(--bg);
  border-bottom:1px solid var(--ivory);
  padding:18px 48px;
  box-shadow:0 2px 0 var(--ivory), 0 4px 0 var(--bg), 0 6px 0 var(--ivory);
}
html[data-theme="carnet"] .nav.scrolled{
  padding:14px 48px;
  background:var(--bg);
}
html[data-theme="carnet"] .nav-logo .mark{
  color:var(--ivory);
  font-family:"EB Garamond"; font-weight:700; font-style:italic;
  letter-spacing:0;
}
html[data-theme="carnet"] .nav-logo .mark .amp{ color:var(--amber); }
html[data-theme="carnet"] .nav-logo .tag{
  color:var(--muted);
  font-family:"Courier Prime", monospace; font-style:normal;
  text-transform:uppercase;
}
html[data-theme="carnet"] .nav-links a{
  color:var(--ivory); opacity:0.85;
  font-family:"Courier Prime", monospace;
  text-transform:uppercase; font-size:12px;
}
html[data-theme="carnet"] .nav-links a:hover{ color:var(--amber); opacity:1; }
html[data-theme="carnet"] .nav-links a.active{ color:var(--amber); }
html[data-theme="carnet"] .nav-links a.active::after{ background:var(--amber); }
html[data-theme="carnet"] .nav-cta{
  background:var(--amber); color:var(--bg); border:none;
  border-radius:0; font-family:"Courier Prime", monospace;
  padding:10px 18px; box-shadow:3px 3px 0 var(--ivory);
}
html[data-theme="carnet"] .nav-cta:hover{
  background:var(--ivory); color:var(--bg);
  box-shadow:5px 5px 0 var(--amber);
  transform:translate(-2px,-2px);
}
html[data-theme="carnet"] .nav-burger span{ background:var(--ivory); }

/* Hero */
html[data-theme="carnet"] .hero{
  background:var(--bg);
}
html[data-theme="carnet"] .hero-glow{ display:none; }
html[data-theme="carnet"] .hero::after{ display:none; }
html[data-theme="carnet"] .eyebrow{
  color:var(--amber);
  font-family:"Courier Prime", monospace; font-style:normal;
  text-transform:uppercase;
}
html[data-theme="carnet"] .eyebrow .dash{ background:var(--amber); }
html[data-theme="carnet"] .hero h1{
  font-family:"EB Garamond"; font-style:italic; font-weight:700;
  letter-spacing:-2px;
  color:var(--ivory);
}
html[data-theme="carnet"] .hero h1 .sub{
  font-family:"Courier Prime", monospace; font-style:normal;
  color:var(--amber); font-weight:400;
  text-transform:uppercase; letter-spacing:3px;
  border-top:1px solid var(--ivory);
  border-bottom:1px solid var(--ivory);
  padding:6px 0; margin-top:24px;
  display:inline-block;
}
html[data-theme="carnet"] .hero h1 .sub .word{ margin-right:6px; }
html[data-theme="carnet"] .hero-tag{
  font-family:"EB Garamond"; font-style:italic;
  color:var(--muted);
}
html[data-theme="carnet"] .hero-tag em{ color:var(--ivory); }
html[data-theme="carnet"] .btn-primary{
  background:var(--amber); color:#fff8e8;
  border-radius:0;
  box-shadow:4px 4px 0 var(--ivory);
}
html[data-theme="carnet"] .btn-primary:hover{
  background:var(--ivory);
  box-shadow:6px 6px 0 var(--amber);
  transform:translate(-2px,-2px);
}
html[data-theme="carnet"] .btn-ghost{
  background:transparent; color:var(--ivory);
  border:1px solid var(--ivory); border-radius:0;
  box-shadow:4px 4px 0 transparent;
}
html[data-theme="carnet"] .btn-ghost:hover{
  background:var(--ivory); color:var(--bg);
  box-shadow:6px 6px 0 var(--muted); transform:translate(-2px,-2px);
}
html[data-theme="carnet"] .hero-meta{ color:var(--muted); }
html[data-theme="carnet"] .hero-meta .stars{ color:var(--amber); }
html[data-theme="carnet"] .hero-meta .divider{ background:var(--line-soft); }

/* Hero plate becomes an ink stamp circle */
html[data-theme="carnet"] .plate-wrap{ animation:none; transform:rotate(-3deg); }
html[data-theme="carnet"] .plate{
  background:transparent;
  border:3px double var(--ivory);
  box-shadow:none;
}
html[data-theme="carnet"] .plate::before{
  content:""; position:absolute; inset:6px;
  border-radius:50%;
  border:1px solid var(--ivory);
  opacity:0.4;
}
html[data-theme="carnet"] .plate-inner{
  background:
    repeating-linear-gradient(45deg,
      var(--ivory) 0, var(--ivory) 1px,
      transparent 1px, transparent 9px);
  color:var(--ivory);
  font-family:"Courier Prime", monospace;
  font-size:13px; letter-spacing:2px;
  mix-blend-mode:multiply;
}
html[data-theme="carnet"] .plate-inner span{ color:var(--ivory); }
html[data-theme="carnet"] .plate-ring{
  border-color:var(--ivory);
  border-style:dashed; border-width:1px;
  animation:spin 90s linear infinite;
}

html[data-theme="carnet"] .open-badge{
  background:var(--bg);
  border:1px solid var(--ivory);
  border-radius:0;
  box-shadow:4px 4px 0 var(--amber);
  transform:rotate(-2deg);
}
html[data-theme="carnet"] .open-badge .flame{
  background:var(--amber);
  box-shadow:none;
}
html[data-theme="carnet"] .open-badge .lbl{
  color:var(--muted);
  font-family:"Courier Prime", monospace; font-style:normal;
  text-transform:uppercase;
}
html[data-theme="carnet"] .open-badge .val{ color:var(--ivory); font-family:"EB Garamond"; font-weight:700; }
html[data-theme="carnet"] .open-badge .pulse{
  background:var(--amber);
  box-shadow:0 0 0 0 rgba(168,52,28,0.5);
  animation:pulseCarnet 1.8s infinite;
}
@keyframes pulseCarnet{
  0%{ box-shadow:0 0 0 0 rgba(168,52,28,0.5); }
  70%{ box-shadow:0 0 0 8px rgba(168,52,28,0); }
  100%{ box-shadow:0 0 0 0 rgba(168,52,28,0); }
}

html[data-theme="carnet"] .dish-card{
  background:var(--bg);
  border:1px solid var(--ivory);
  border-radius:0;
  box-shadow:4px 4px 0 var(--ivory);
  backdrop-filter:none;
  transform:rotate(-1.5deg);
}
html[data-theme="carnet"] .dish-thumb{
  border:1px solid var(--ivory);
  border-radius:0;
}
html[data-theme="carnet"] .dish-info .name{ color:var(--ivory); font-family:"EB Garamond"; }
html[data-theme="carnet"] .dish-info .desc{ color:var(--muted); }
html[data-theme="carnet"] .dish-info .price{ color:var(--amber); font-family:"EB Garamond"; }

html[data-theme="carnet"] .scroll-cue{ color:var(--muted); font-family:"Courier Prime"; font-style:normal; }
html[data-theme="carnet"] .scroll-cue .line{ background:linear-gradient(to bottom, var(--amber), transparent); }

/* Stats - newspaper style */
html[data-theme="carnet"] .stats{
  background:var(--bg);
  border-top:2px solid var(--ivory);
  border-bottom:2px solid var(--ivory);
  position:relative;
}
html[data-theme="carnet"] .stats::before{
  content:""; position:absolute; left:0; right:0; top:4px;
  height:1px; background:var(--ivory); opacity:0.5;
}
html[data-theme="carnet"] .stats::after{
  content:""; position:absolute; left:0; right:0; bottom:4px;
  height:1px; background:var(--ivory); opacity:0.5;
}
html[data-theme="carnet"] .stat:not(:last-child)::after{
  background:var(--line-soft);
}
html[data-theme="carnet"] .stat .num{
  font-family:"EB Garamond"; font-style:italic; font-weight:700;
  color:var(--amber);
}
html[data-theme="carnet"] .stat .lbl{
  font-family:"EB Garamond"; font-style:italic; color:var(--ivory);
}
html[data-theme="carnet"] .stat .sub{ color:var(--muted); font-family:"Courier Prime", monospace; }

/* Section headings */
html[data-theme="carnet"] .section,
html[data-theme="carnet"] .ambiance,
html[data-theme="carnet"] .menu-preview,
html[data-theme="carnet"] .reservation{
  background:var(--bg);
}
html[data-theme="carnet"] .specialties{ background:var(--bg-3); }
html[data-theme="carnet"] .menu-preview{ background:var(--bg-3); }
html[data-theme="carnet"] .section-eyebrow{
  color:var(--amber);
  font-family:"Courier Prime", monospace; font-style:normal;
  text-transform:uppercase;
}
html[data-theme="carnet"] .section-eyebrow .dash{ background:var(--amber); }
html[data-theme="carnet"] .section-title{
  font-family:"EB Garamond"; font-style:italic; font-weight:700;
  color:var(--ivory);
}
html[data-theme="carnet"] .section-title em{
  color:var(--amber); background:none;
  -webkit-text-fill-color:var(--amber);
  text-decoration:underline; text-decoration-style:wavy;
  text-decoration-thickness:1px;
  text-underline-offset:8px;
}
html[data-theme="carnet"] .section-lede{
  font-family:"EB Garamond"; font-style:italic; color:var(--muted);
}

/* Specialties cards = recipe cards */
html[data-theme="carnet"] .ardoise{
  font-family:"EB Garamond"; font-style:italic; color:var(--muted);
  border-left-color:var(--amber);
}
html[data-theme="carnet"] .ardoise b{
  font-family:"Courier Prime", monospace;
  color:var(--ivory);
}
html[data-theme="carnet"] .spec-card{
  background:var(--bg);
  border:2px solid var(--ivory);
  border-radius:0;
  box-shadow:6px 6px 0 var(--ivory);
}
html[data-theme="carnet"] .spec-card::before{
  background:radial-gradient(circle at 50% 0%, rgba(168,52,28,0.10), transparent 60%);
}
html[data-theme="carnet"] .spec-card:hover{
  transform:translate(-3px,-3px);
  box-shadow:9px 9px 0 var(--amber);
  border-color:var(--ivory);
}
html[data-theme="carnet"] .spec-card .num{
  color:var(--amber);
  font-family:"Courier Prime", monospace; font-style:normal;
}
html[data-theme="carnet"] .spec-card .picto{
  background:transparent;
  border:1px solid var(--ivory); border-radius:0;
}
html[data-theme="carnet"] .spec-card .picto svg{ stroke:var(--amber); }
html[data-theme="carnet"] .spec-card h3{
  color:var(--ivory); font-family:"EB Garamond"; font-style:italic; font-weight:700;
}
html[data-theme="carnet"] .spec-card .ingredients{
  color:var(--muted); font-family:"EB Garamond"; font-style:italic;
}
html[data-theme="carnet"] .spec-card .price-row{ border-top:1px dashed var(--line); }
html[data-theme="carnet"] .spec-card .price{ color:var(--amber); font-family:"EB Garamond"; }
html[data-theme="carnet"] .spec-card .arrow-btn{
  border:1px solid var(--ivory); border-radius:0; color:var(--amber);
}
html[data-theme="carnet"] .spec-card:hover .arrow-btn{
  background:var(--amber); color:var(--bg); border-color:var(--amber);
}
html[data-theme="carnet"] .spec-card .tag{
  background:var(--ivory); color:var(--bg);
  border:none; border-radius:0;
  font-family:"Courier Prime", monospace; font-style:normal;
  letter-spacing:2px;
}

/* Ambiance */
html[data-theme="carnet"] .ambiance{
  background:var(--bg-2);
  border-top:1px solid var(--ivory);
  border-bottom:1px solid var(--ivory);
}
html[data-theme="carnet"] .ambiance::before{ opacity:0.2; }
html[data-theme="carnet"] .ambiance-text h2{
  font-family:"EB Garamond"; font-style:italic; color:var(--ivory);
}
html[data-theme="carnet"] .ambiance-text h2 span{ color:var(--amber); }
html[data-theme="carnet"] .ambiance-text p{
  font-family:"EB Garamond"; color:var(--ivory); opacity:0.9;
}
html[data-theme="carnet"] .ambiance-text .signature{
  font-family:"EB Garamond"; font-style:italic; color:var(--amber);
}
html[data-theme="carnet"] .ambiance-text .signature-sub{
  font-family:"Courier Prime", monospace; color:var(--muted);
}
html[data-theme="carnet"] .tile{
  background:var(--bg);
  border:1px solid var(--ivory); border-radius:0;
}
html[data-theme="carnet"] .tile h4{
  color:var(--ivory); font-family:"EB Garamond"; font-style:italic;
}
html[data-theme="carnet"] .tile .ph{ color:var(--muted); font-family:"Courier Prime", monospace; }
html[data-theme="carnet"] .tile-1, html[data-theme="carnet"] .tile-2,
html[data-theme="carnet"] .tile-3, html[data-theme="carnet"] .tile-4{
  background:var(--bg);
}
html[data-theme="carnet"] .tile-1{
  background:
    repeating-linear-gradient(0deg, rgba(42,26,14,0.10) 0 1px, transparent 1px 26px),
    var(--bg);
}
html[data-theme="carnet"] .tile-2{
  background:
    radial-gradient(circle at 30% 30%, rgba(168,52,28,0.15), transparent 60%),
    var(--bg);
}
html[data-theme="carnet"] .tile-3{
  background:
    repeating-linear-gradient(45deg, rgba(42,26,14,0.08) 0 1px, transparent 1px 8px),
    var(--bg);
}
html[data-theme="carnet"] .tile-4{
  background:
    radial-gradient(circle at 70% 70%, rgba(168,52,28,0.2), transparent 55%),
    var(--bg);
}

/* Menu preview */
html[data-theme="carnet"] .menu-col h3{
  font-family:"EB Garamond"; font-style:italic; color:var(--amber);
  border-bottom:1px solid var(--ivory);
}
html[data-theme="carnet"] .menu-col h3 .count{ color:var(--muted); font-family:"Courier Prime", monospace; }
html[data-theme="carnet"] .menu-item{ border-bottom:1px dashed var(--line-soft); }
html[data-theme="carnet"] .menu-item .name{ color:var(--ivory); font-family:"EB Garamond"; font-style:italic; }
html[data-theme="carnet"] .menu-item .desc{ color:var(--muted); }
html[data-theme="carnet"] .menu-item .dots{ border-color:var(--line); }
html[data-theme="carnet"] .menu-item .pr{ color:var(--amber); font-family:"EB Garamond"; }

/* Reservation */
html[data-theme="carnet"] .reservation::before{ display:none; }
html[data-theme="carnet"] .form-field label{
  color:var(--muted); font-family:"Courier Prime", monospace; font-style:normal;
}
html[data-theme="carnet"] .form-field input,
html[data-theme="carnet"] .form-field select{
  background:var(--bg-3);
  border:1px solid var(--ivory); border-radius:0;
  color:var(--ivory); font-family:"EB Garamond";
}
html[data-theme="carnet"] .form-field input:focus,
html[data-theme="carnet"] .form-field select:focus{
  border-color:var(--amber);
  box-shadow:4px 4px 0 var(--amber);
  background:var(--bg);
}
html[data-theme="carnet"] .form-field input::placeholder{ color:var(--muted); opacity:0.5; }
html[data-theme="carnet"] .slot{
  background:var(--bg-3);
  border:1px solid var(--ivory); border-radius:0;
  color:var(--ivory); font-family:"Courier Prime", monospace;
}
html[data-theme="carnet"] .slot:hover{ border-color:var(--amber); color:var(--amber); }
html[data-theme="carnet"] .slot.active{
  background:var(--amber); color:var(--bg); border-color:var(--amber);
  box-shadow:3px 3px 0 var(--ivory);
}
html[data-theme="carnet"] .phone-line{ color:var(--muted); font-family:"EB Garamond"; font-style:italic; }
html[data-theme="carnet"] .phone-line a{ color:var(--amber); }
html[data-theme="carnet"] .reservation-success h3{ color:var(--ivory); font-family:"EB Garamond"; }
html[data-theme="carnet"] .reservation-success p{ color:var(--muted); font-family:"EB Garamond"; }
html[data-theme="carnet"] .reservation-success .check{
  background:var(--bg-3); border-color:var(--amber);
  box-shadow:0 0 40px rgba(168,52,28,0.2);
}
html[data-theme="carnet"] .reservation-success .ref{
  background:var(--bg-3); border:1px solid var(--ivory);
  color:var(--amber);
}

/* Footer */
html[data-theme="carnet"] footer{
  background:var(--ivory); color:var(--bg);
  border-top:none;
  padding-top:60px;
}
html[data-theme="carnet"] footer .foot-brand .mark{ color:var(--bg); }
html[data-theme="carnet"] footer .foot-brand .desc{ color:rgba(230,216,189,0.7); font-family:"EB Garamond"; }
html[data-theme="carnet"] footer .foot-col h5{ color:var(--gold); font-family:"Courier Prime", monospace; }
html[data-theme="carnet"] footer .foot-col p,
html[data-theme="carnet"] footer .foot-col a{ color:rgba(230,216,189,0.7); }
html[data-theme="carnet"] footer .foot-col a:hover{ color:var(--bg); }
html[data-theme="carnet"] footer .foot-col .hours .day{ color:var(--bg); }
html[data-theme="carnet"] .foot-bottom{ border-top-color:rgba(230,216,189,0.2); }
html[data-theme="carnet"] .foot-bottom .closing{ color:var(--gold); font-family:"EB Garamond"; font-style:italic; }
html[data-theme="carnet"] .foot-bottom .credit{ color:rgba(230,216,189,0.5); font-family:"Courier Prime", monospace; }


/* ============================================================
   C · BRASSERIE BELLE ÉPOQUE — cream, bordeaux, gold
   ============================================================ */
html[data-theme="brasserie"]{
  --bg:#f1e5cf;          /* ivory cream */
  --bg-2:#e8d9bd;
  --bg-3:#fcf3df;
  --amber:#5c1620;       /* bordeaux primary */
  --amber-bright:#7a1d2c;
  --gold:#b89456;        /* real gold */
  --ivory:#2b1410;       /* deep brown text */
  --muted:#7a5a3e;
  --line:rgba(184,148,86,0.55);
  --line-soft:rgba(43,20,16,0.12);
  --serif:"Bodoni Moda", "Playfair Display", serif;
  --serif-2:"Cormorant Garamond", serif;
  --serif-3:"Cormorant Garamond", serif;
  --sans:"Cormorant Garamond", serif;
}
html[data-theme="brasserie"] body{ background:var(--bg); color:var(--ivory); }
html[data-theme="brasserie"] body::before{
  opacity:0.04; mix-blend-mode:multiply;
}

/* Subtle damask / vignette */
html[data-theme="brasserie"] body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:199;
  background:radial-gradient(ellipse at center, transparent 50%, rgba(43,20,16,0.10) 100%);
}

/* Nav */
html[data-theme="brasserie"] .nav{
  background:linear-gradient(to bottom, rgba(241,229,207,0.95), rgba(241,229,207,0.5));
  border-bottom:1px solid var(--line);
}
html[data-theme="brasserie"] .nav.scrolled{
  background:rgba(241,229,207,0.97);
  box-shadow:0 1px 0 var(--gold), 0 2px 0 var(--bg), 0 3px 0 var(--gold);
}
html[data-theme="brasserie"] .nav-logo .mark{
  color:var(--amber); font-family:"Bodoni Moda"; font-weight:700; font-style:italic;
}
html[data-theme="brasserie"] .nav-logo .mark .amp{ color:var(--gold); }
html[data-theme="brasserie"] .nav-logo .tag{
  color:var(--gold); font-family:"Cormorant Garamond"; font-style:italic;
}
html[data-theme="brasserie"] .nav-links a{
  color:var(--ivory); opacity:0.85;
  font-family:"Cormorant Garamond"; font-style:italic;
  font-size:16px; letter-spacing:0.5px; text-transform:none;
}
html[data-theme="brasserie"] .nav-links a:hover{ color:var(--amber); }
html[data-theme="brasserie"] .nav-links a.active{ color:var(--amber); }
html[data-theme="brasserie"] .nav-links a.active::after{ background:var(--gold); height:1px; }
html[data-theme="brasserie"] .nav-cta{
  background:var(--amber); color:var(--bg); border:1px solid var(--gold);
  font-family:"Cormorant Garamond"; font-weight:600; font-style:italic;
  text-transform:none; letter-spacing:0.5px; font-size:15px;
  padding:10px 22px;
}
html[data-theme="brasserie"] .nav-cta:hover{
  background:var(--gold); color:var(--amber);
  box-shadow:0 0 20px rgba(184,148,86,0.5);
}
html[data-theme="brasserie"] .nav-burger span{ background:var(--amber); }

/* Hero */
html[data-theme="brasserie"] .hero{
  background:
    radial-gradient(ellipse at 30% 20%, rgba(184,148,86,0.15), transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(92,22,32,0.06), transparent 55%),
    var(--bg);
}
html[data-theme="brasserie"] .hero::after{
  background:linear-gradient(to bottom, transparent, var(--bg));
}
html[data-theme="brasserie"] .hero-glow{
  background:radial-gradient(circle, rgba(184,148,86,0.22), rgba(184,148,86,0.05) 40%, transparent 70%);
}
html[data-theme="brasserie"] .eyebrow{
  color:var(--amber);
  font-family:"Cormorant Garamond"; font-style:italic;
  font-size:14px;
}
html[data-theme="brasserie"] .eyebrow .dash{ background:var(--gold); }
html[data-theme="brasserie"] .hero h1{
  font-family:"Bodoni Moda"; font-style:italic; font-weight:700;
  color:var(--amber); letter-spacing:-2px;
  line-height:0.92;
}
html[data-theme="brasserie"] .hero h1 .sub{
  font-family:"Cormorant Garamond"; font-style:italic; font-weight:500;
  color:var(--gold); text-transform:none; letter-spacing:1px;
  font-size:clamp(22px, 2vw, 30px);
}
html[data-theme="brasserie"] .hero-tag{
  font-family:"Cormorant Garamond"; font-style:italic;
  color:var(--muted); font-size:22px;
}
html[data-theme="brasserie"] .hero-tag em{ color:var(--amber); font-weight:500; }

html[data-theme="brasserie"] .btn{
  font-family:"Cormorant Garamond"; font-weight:600; font-style:italic;
  text-transform:none; letter-spacing:0.5px; font-size:17px;
  padding:16px 32px;
}
html[data-theme="brasserie"] .btn-primary{
  background:var(--amber); color:var(--bg);
  border:1px solid var(--gold);
  box-shadow:0 8px 24px rgba(92,22,32,0.25);
}
html[data-theme="brasserie"] .btn-primary:hover{
  background:var(--amber-bright);
  box-shadow:0 0 30px rgba(184,148,86,0.5), 0 8px 28px rgba(92,22,32,0.35);
}
html[data-theme="brasserie"] .btn-ghost{
  background:transparent; color:var(--amber);
  border:1px solid var(--amber);
}
html[data-theme="brasserie"] .btn-ghost:hover{
  background:var(--amber); color:var(--bg);
}
html[data-theme="brasserie"] .hero-meta{ color:var(--muted); font-family:"Cormorant Garamond"; font-style:italic; font-size:14px; text-transform:none; letter-spacing:0; }
html[data-theme="brasserie"] .hero-meta .stars{ color:var(--gold); }

/* Hero plate = gold medallion */
html[data-theme="brasserie"] .plate{
  background:
    radial-gradient(circle at 35% 30%, rgba(255,232,180,0.5), transparent 40%),
    radial-gradient(circle at 50% 50%, #f5e4be 0%, #d6b67a 60%, #8e6f3e 100%);
  border:3px solid var(--gold);
  box-shadow:
    0 0 0 1px var(--amber),
    0 0 0 12px var(--bg),
    0 0 0 13px var(--gold),
    0 40px 80px -20px rgba(92,22,32,0.4),
    inset 0 0 30px rgba(92,22,32,0.2);
}
html[data-theme="brasserie"] .plate-inner{
  background:
    radial-gradient(circle, rgba(184,148,86,0.4), rgba(92,22,32,0.3) 70%);
  color:var(--amber);
  font-family:"Cormorant Garamond"; font-style:italic;
  font-size:14px; letter-spacing:1.5px;
  border:1px solid rgba(92,22,32,0.4);
}
html[data-theme="brasserie"] .plate-ring{
  border-color:var(--gold);
  border-style:solid; border-width:1px;
  inset:-40px;
}
html[data-theme="brasserie"] .plate-ring::before{
  content:""; position:absolute; inset:-12px;
  border:1px dashed var(--gold); border-radius:50%;
  opacity:0.5;
}

html[data-theme="brasserie"] .open-badge{
  background:var(--bg-3);
  border:1px solid var(--gold);
  box-shadow:0 12px 32px rgba(92,22,32,0.25), 0 0 0 4px var(--bg), 0 0 0 5px var(--gold);
}
html[data-theme="brasserie"] .open-badge .flame{
  background:radial-gradient(circle at 50% 60%, var(--gold), var(--amber) 60%, var(--amber));
  box-shadow:0 0 16px rgba(184,148,86,0.5);
}
html[data-theme="brasserie"] .open-badge .lbl{ color:var(--muted); font-family:"Cormorant Garamond"; font-style:italic; text-transform:none; font-size:12px; letter-spacing:0.5px; }
html[data-theme="brasserie"] .open-badge .val{ color:var(--amber); font-family:"Bodoni Moda"; font-weight:700; }
html[data-theme="brasserie"] .open-badge .pulse{ background:#7a9a3e; }

html[data-theme="brasserie"] .dish-card{
  background:var(--bg-3);
  border:1px solid var(--gold);
  box-shadow:0 24px 60px rgba(92,22,32,0.2), 0 0 0 4px var(--bg), 0 0 0 5px var(--gold);
}
html[data-theme="brasserie"] .dish-thumb{
  border:1px solid var(--gold);
  background:
    repeating-linear-gradient(45deg,
      rgba(184,148,86,0.3) 0, rgba(184,148,86,0.3) 4px,
      rgba(92,22,32,0.2) 4px, rgba(92,22,32,0.2) 8px);
}
html[data-theme="brasserie"] .dish-info .name{ color:var(--amber); font-family:"Bodoni Moda"; font-style:italic; }
html[data-theme="brasserie"] .dish-info .desc{ color:var(--muted); font-family:"Cormorant Garamond"; font-style:italic; }
html[data-theme="brasserie"] .dish-info .price{ color:var(--amber); font-family:"Bodoni Moda"; }

html[data-theme="brasserie"] .scroll-cue{ color:var(--muted); font-family:"Cormorant Garamond"; font-style:italic; text-transform:none; font-size:13px; letter-spacing:1px; }
html[data-theme="brasserie"] .scroll-cue .line{ background:linear-gradient(to bottom, var(--gold), transparent); }

/* Stats — with gold filets */
html[data-theme="brasserie"] .stats{
  background:linear-gradient(to bottom, var(--bg-2), var(--bg));
  border-top:1px solid var(--gold);
  border-bottom:1px solid var(--gold);
  position:relative;
}
html[data-theme="brasserie"] .stats::before{
  content:""; position:absolute; left:48px; right:48px; top:6px;
  height:1px; background:var(--gold); opacity:0.4;
}
html[data-theme="brasserie"] .stats::after{
  content:""; position:absolute; left:48px; right:48px; bottom:6px;
  height:1px; background:var(--gold); opacity:0.4;
}
html[data-theme="brasserie"] .stat:not(:last-child)::after{ background:var(--line); }
html[data-theme="brasserie"] .stat .num{
  font-family:"Bodoni Moda"; font-style:italic; font-weight:700;
  color:var(--amber);
}
html[data-theme="brasserie"] .stat .lbl{
  font-family:"Cormorant Garamond"; font-style:italic; color:var(--ivory); font-size:15px;
}
html[data-theme="brasserie"] .stat .sub{ color:var(--muted); }

/* Sections */
html[data-theme="brasserie"] .section,
html[data-theme="brasserie"] .ambiance,
html[data-theme="brasserie"] .menu-preview,
html[data-theme="brasserie"] .reservation{
  background:var(--bg);
}
html[data-theme="brasserie"] .specialties{ background:var(--bg-3); }
html[data-theme="brasserie"] .menu-preview{ background:var(--bg-2); }
html[data-theme="brasserie"] .section-eyebrow{
  color:var(--gold);
  font-family:"Cormorant Garamond"; font-style:italic;
  font-size:14px; letter-spacing:4px; text-transform:uppercase;
}
html[data-theme="brasserie"] .section-eyebrow .dash{ background:var(--gold); }
html[data-theme="brasserie"] .section-title{
  font-family:"Bodoni Moda"; font-style:italic; font-weight:700;
  color:var(--amber); letter-spacing:-1px;
}
html[data-theme="brasserie"] .section-title em{
  color:var(--gold); background:none;
  -webkit-text-fill-color:var(--gold);
}
html[data-theme="brasserie"] .section-lede{
  font-family:"Cormorant Garamond"; font-style:italic;
  color:var(--muted); font-size:20px;
}

/* Cards = vignettes encadrées */
html[data-theme="brasserie"] .ardoise{
  font-family:"Cormorant Garamond"; font-style:italic;
  color:var(--muted); font-size:15px;
  border-left:2px solid var(--gold);
}
html[data-theme="brasserie"] .ardoise b{
  font-family:"Bodoni Moda"; font-style:italic; font-weight:700;
  color:var(--amber);
}
html[data-theme="brasserie"] .spec-card{
  background:var(--bg);
  border:1px solid var(--gold);
  box-shadow:0 0 0 5px var(--bg-3), 0 0 0 6px var(--gold), 0 10px 30px rgba(92,22,32,0.15);
  border-radius:0;
  padding:36px;
}
html[data-theme="brasserie"] .spec-card::before{
  background:radial-gradient(circle at 50% 0%, rgba(184,148,86,0.2), transparent 60%);
}
html[data-theme="brasserie"] .spec-card:hover{
  transform:translateY(-4px);
  box-shadow:0 0 0 5px var(--bg-3), 0 0 0 6px var(--amber), 0 24px 60px rgba(92,22,32,0.25);
  border-color:var(--amber);
}
html[data-theme="brasserie"] .spec-card .num{
  color:var(--gold); font-family:"Bodoni Moda"; font-style:italic;
}
html[data-theme="brasserie"] .spec-card .picto{
  background:linear-gradient(135deg, rgba(184,148,86,0.2), rgba(92,22,32,0.05));
  border:1px solid var(--gold);
}
html[data-theme="brasserie"] .spec-card .picto svg{ stroke:var(--amber); }
html[data-theme="brasserie"] .spec-card h3{
  color:var(--amber); font-family:"Bodoni Moda"; font-style:italic; font-weight:700;
}
html[data-theme="brasserie"] .spec-card .ingredients{
  color:var(--muted); font-family:"Cormorant Garamond"; font-style:italic; font-size:15px;
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.

  // state is mirrored from the same localStorage key the deck reads so

    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),

  // mount before that element has upgraded. The initial read catches the

  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)

    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );

    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {

    };
    window.addEventListener('message', onMsg);

  });

    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// ===== Helpers =====
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add('in');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useCountUp(target, run, opts = {}) {
  const [val, setVal] = useState(0);
  const { duration = 1600, decimals = 0 } = opts;
  useEffect(() => {
    if (!run) return;
    let raf, start;
    const step = (t) => {
      if (!start) start = t;
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(target * eased);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [run, target, duration]);
  return decimals === 0 ? Math.round(val) : val.toFixed(decimals);
}

// ===== RESERVATION =====
function Reservation({ showOrn }) {
  useReveal();
  const today = new Date();
  const minDate = today.toISOString().slice(0, 10);

  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [email, setEmail] = useState('');
  const [date, setDate] = useState(minDate);
  const [guests, setGuests] = useState('2');
  const [slot, setSlot] = useState('20:00');
  const [errors, setErrors] = useState({});
  const [done, setDone] = useState(false);
  const [ref, setRef] = useState('');

  const slots = [
    { t: '19:00', full: false },
    { t: '19:30', full: false },
    { t: '20:00', full: false },
    { t: '20:30', full: true },
    { t: '21:00', full: false },
    { t: '21:30', full: false },
    { t: '22:00', full: false },
  ];

  const submit = (e) => {
    e.preventDefault();
    const errs = {};
    if (!name.trim() || name.trim().length < 2) errs.name = 'Indiquez votre nom';
    if (!/^[0-9+\s().-]{8,}$/.test(phone)) errs.phone = 'Téléphone non valide';
    if (email && !/^[^@]+@[^@]+\.[^@]+$/.test(email)) errs.email = 'Email non valide';
    if (!slot) errs.slot = 'Choisissez un créneau';
    setErrors(errs);
    if (Object.keys(errs).length === 0) {
      const r = 'ALC-' + Math.random().toString(36).slice(2, 7).toUpperCase();
      setRef(r);
      setDone(true);
    }
  };

  if (done) {
    return (
      <section className="reservation" id="reservation">
        <div className="reservation-inner">
          <div className="reservation-success">
            <div className="check">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#d4832a" strokeWidth="1.5">
                <path d="M5 12l5 5 9-11"/>
              </svg>
            </div>
            <h3>À très vite, {name.split(' ')[0]}.</h3>
            <p>
              Votre table pour <b style={{color:'var(--gold)'}}>{guests} personnes</b> le{' '}
              <b style={{color:'var(--gold)'}}>{new Date(date).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</b>{' '}
              à <b style={{color:'var(--gold)'}}>{slot}</b> est confirmée.
              Un SMS de rappel vous sera envoyé deux heures avant.
            </p>
            <div className="ref">Réf · {ref}</div>
            <div style={{ marginTop: 28 }}>
              <button className="btn btn-ghost" onClick={() => { setDone(false); setName(''); setPhone(''); setEmail(''); }}>
                Nouvelle réservation
              </button>
            </div>
          </div>
        </div>
      </section>
    );
  }

  return (
    <section className="reservation" id="reservation">
      <div className="reservation-inner">
        <div className="section-eyebrow reveal">
          <span className="dash" />Réservation
          <span className="dash" />
        </div>
        <Orn show={showOrn} />
        <h2 className="section-title reveal" data-delay="1">
          Une <em>table</em> ce soir.
        </h2>
        <p className="section-lede reveal" data-delay="2" style={{ margin: '16px auto 0' }}>
          Réservation conseillée. Confirmation immédiate, sans empreinte de carte.
        </p>

        <form className="form-grid reveal" data-delay="3" onSubmit={submit}>
          <div className={`form-field ${errors.name ? 'has-error' : ''}`}>
            <label>Nom</label>
            <input type="text" placeholder="Votre nom" value={name} onChange={e => setName(e.target.value)} />
            {errors.name && <span className="err">{errors.name}</span>}
          </div>
          <div className={`form-field ${errors.phone ? 'has-error' : ''}`}>
            <label>Téléphone</label>
            <input type="tel" placeholder="06 00 00 00 00" value={phone} onChange={e => setPhone(e.target.value)} />
            {errors.phone && <span className="err">{errors.phone}</span>}
          </div>
          <div className="form-field">
            <label>Date</label>
            <input type="date" min={minDate} value={date} onChange={e => setDate(e.target.value)} />
          </div>
          <div className="form-field">
            <label>Personnes</label>
            <select value={guests} onChange={e => setGuests(e.target.value)}>
              {[1,2,3,4,5,6,7,8].map(n => <option key={n} value={n}>{n} {n===1?'personne':'personnes'}</option>)}
              <option value="9+">9 et + (nous appeler)</option>
            </select>
          </div>
          <div className={`form-field full ${errors.email ? 'has-error' : ''}`}>
            <label>Email (optionnel)</label>
            <input type="email" placeholder="pour le rappel" value={email} onChange={e => setEmail(e.target.value)} />
            {errors.email && <span className="err">{errors.email}</span>}
          </div>
          <div className="form-field full">
            <label>Créneau</label>
            <div className="slot-row">
              {slots.map(s => (
                <button
                  type="button"
                  key={s.t}
                  className={`slot ${slot === s.t ? 'active' : ''} ${s.full ? 'full' : ''}`}
                  disabled={s.full}
                  onClick={() => !s.full && setSlot(s.t)}
                >{s.t}</button>
              ))}
            </div>
          </div>
          <div className="form-field full">
            <div className="submit-row">
              <button type="submit" className="btn btn-primary">
                Confirmer la table <span className="arrow">→</span>
              </button>
              <div className="phone-line">
                Ou appelez le <a href="tel:+33143471038">01 43 47 10 38</a>
              </div>
            </div>
          </div>
        </form>
      </div>
    </section>
  );
}

// ===== APP =====
function App() {
  const [active, setActive] = useState('accueil');
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply theme on documentElement
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', t.theme);
  }, [t.theme]);

  const onNav = (id) => {
    const el = document.getElementById(id);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 60;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  };

  useEffect(() => {
    const sections = ['accueil','specialites','maison','carte','reservation'];
    const onS = () => {
      const y = window.scrollY + 120;
      let cur = sections[0];
      for (const s of sections) {
        const el = document.getElementById(s);
        if (el && el.offsetTop <= y) cur = s;
      }
      setActive(cur);
    };
    window.addEventListener('scroll', onS);
    return () => window.removeEventListener('scroll', onS);
  }, []);

  return (
    <>
      <Nav active={active} onNav={onNav} />
      <Hero onNav={onNav} theme={t.theme} showOrn={t.showOrnaments} />
      <Stats />
      <Specialties showOrn={t.showOrnaments} />
      <Ambiance />
      <MenuPreview showOrn={t.showOrnaments} />
      <Reservation showOrn={t.showOrnaments} />
      <Footer />

      <TweaksPanel>
        <TweakSection label="Univers visuel" />
        <TweakSelect
          label="Thème"
          value={t.theme}
          options={[
            { value: 'soir',      label: 'Soir tamisé · dark amber' },
            { value: 'carnet',    label: 'Carnet de Paulo · kraft' },
            { value: 'brasserie', label: 'Belle Époque · or & bordeaux' },
          ]}
          onChange={(v) => setTweak('theme', v)}
        />
        <TweakToggle
          label="Ornements typographiques"
          value={t.showOrnaments}
          onChange={(v) => setTweak('showOrnaments', v)}
        />
        <TweakSection label="À propos" />
        <div style={{ fontSize: 11, lineHeight: 1.55, opacity: 0.7, padding: '4px 0' }}>
          Trois directions complètes : couleurs, typographies, textures et traitement des cards.
          Chaque thème change l'ambiance plus que la palette.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
